  toc_title: Severn Estuary Wind & Tidal Feasibility
  title: Offshore Wind and Tidal Feasibility Study for Industrial Decarbonisation
  dates:
    start: 2024-09-01
    end: 2025-05-01
  role: Resource & Array Modelling · Condition Monitoring · Financial Analysis
  domain: Renewable Energy | Offshore Engineering | Sustainability
  one_liner: >
    Feasibility study for decarbonising an industrial chemical site with offshore wind, tidal analysis, grid integration, and cost modelling.
  summary_short: >
    Assessed renewable energy options for the Dow Barry site, including wind resource, tidal feasibility, turbine layout,
    grid connection, foundation assumptions, structural health monitoring, and levelised cost of energy. The final concept
    favoured offshore wind because the tidal option became infeasible at the required industrial energy scale.
  tags: [Resource assessment, Bathymetry, Offshore wind, Tidal energy, Grid connection, LCOE, SHM]
  stack: [Python, PyWake, SciPy, MATLAB, GIS, Google Earth Pro]
  impact_metrics:
    - { label: Wind concept, value: "21 × 15 MW", note: "Vestas V236-15 MW turbine assumption" }
    - { label: Study AEP, value: "≈1,344 GWh/yr", note: "Estimated after wake modelling assumptions" }
    - { label: Industrial demand, value: "≈1.1–1.3 TWh/yr", note: "Order-of-magnitude decarbonisation requirement" }
  highlights:
    - "Mapped wind, tidal, bathymetry, shipping, and grid constraints"
    - "Compared wind and tidal feasibility at industrial energy demand scale"
    - "Included condition-monitoring and maintenance assumptions in the feasibility narrative"
  case_study:
    problem: >
      A chemical manufacturing site needs very large, reliable, low-carbon energy. The challenge was not simply to
      estimate generation, but to test whether candidate renewable options were feasible once bathymetry, shipping,
      grid connection, wake losses, maintenance, and cost were included.
    approach: >
      The project integrated resource assessment, turbine selection, wake modelling, cable routing, grid-connection
      assumptions, foundation design, environmental considerations, structural health monitoring, and levelised cost
      modelling into a single feasibility narrative.
    experiments:
      - "Compared wind, tidal, and hybrid options under site and energy-demand constraints"
      - "Modelled wind-farm wake effects and turbine layout options"
      - "Assessed why tidal turbine counts became impractical at the required scale"
    results: >
      Offshore wind was the more feasible route under the study assumptions. Tidal energy remained technically
      interesting but required an impractically large turbine count and faced major uncertainty around bathymetry,
      wake losses, shipping, and installation complexity.
    learnings:
