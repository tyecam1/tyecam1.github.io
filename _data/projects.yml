- key: fem-wing
  featured: false
  status: past
  toc_title: FEM Wing Optimisation
  title: Custom Finite Element Solver for Wing Stress Optimisation
  dates:
    start: 2024-02-01
    end: 2024-05-01
  role: Lead Developer & Researcher
  domain: Computational Mechanics | Optimisation | Aerospace Structures
  one_liner: >
    Python FEM solver for a simplified orthotropic wing section, linking numerical methods to design optimisation.
  summary_short: >
    Implemented a finite element solver for 4-node and 8-node quadrilateral meshes, then used differential evolution
    to study how backward sweep and dihedral affected stress concentration under drag loading.
  tags: [Custom FEM, Quadrilateral elements, Gauss quadrature, Differential evolution, ParaView]
  stack: [Python, NumPy, SciPy, Matplotlib, ParaView, Gmsh]
  impact_metrics:
    - { label: Element types, value: "4- and 8-node", note: "Quadrilateral meshes" }
    - { label: Optimisation variables, value: "θ and ϕ", note: "Backward sweep and dihedral angles" }
    - { label: Best reported case, value: "0.91 MPa VM", note: "For the reported optimum material/geometry combination" }
  highlights:
    - "Built the solver rather than only using commercial FEA software"
    - "Compared accuracy and computational cost between element orders"
    - "Connected geometry, material assumptions, and stress redistribution"
  case_study:
    problem: |
      The project asked how wing geometry affects stress concentration under drag loading while maintaining a fixed
      simplified wing area and orthotropic material behaviour.
    approach: |
      I implemented quadrilateral finite elements, assembled the global stiffness matrix, applied boundary conditions,
      exported stress fields, and used differential evolution to search the geometry space.
    experiments: |
      Swept backward sweep and dihedral angles across material-property combinations, comparing 4-node and 8-node meshes
      and visualising stress fields in ParaView.
    results: |
      The strongest design lesson was the trade-off between accuracy, computational cost, and geometry constraints.
      Higher-order elements improved stress-gradient capture near critical regions but increased computational time.
    learnings:
      - "Numerical optimisation is only useful when constraints are enforced cleanly"
      - "Mesh order and geometry parameterisation can change the interpretation of stress trends"
