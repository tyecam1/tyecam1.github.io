- key: walkaide
  featured: true
  status: past
  toc_title: Wearable Navigation System
  title: Wearable Indoor Navigation Aid with Haptic Feedback
  dates:
    start: 2024-09-01
    end: 2025-05-01
  role: Systems Engineer
  domain: Robotics | Assistive Robotics | Haptics | Visual SLAM | Human Factors
  one_liner: >
    Wearable indoor navigation aid combining RGB-D perception, visual SLAM, artificial potential field planning, and haptic feedback.
  summary_short: >
    Built and evaluated a ROS-based wearable navigation prototype for indoor mobility support. The system combined
    Intel RealSense RGB-D perception, RTAB-Map visual SLAM, artificial potential field planning, Arduino-controlled
    haptic actuation, and timestamped event logging. Blindfolded trials compared compass-style pressure cues against
    shoulder-pull cues across two indoor environments.
  tags:
    - ROS Noetic
    - Python
    - RTAB-Map
    - RGB-D perception
    - Intel RealSense D435i
    - Arduino Nano 33 BLE
    - Artificial Potential Fields
    - Haptic feedback
    - EEG event logging
    - Human-subject testing
  stack:
    - ROS Noetic
    - Python
    - RTAB-Map
    - Intel RealSense
    - Arduino
    - CYKIT/Emotiv event logging
  impact_metrics:
    - { label: Success rate, value: "83–77% vs 50–66%", note: "Compass-style pressure cues vs shoulder-pull cues" }
    - { label: Collisions per trial, value: "0–0.42 vs up to 1.17", note: "Compass-style pressure cues vs shoulder-pull cues" }
    - { label: Reaction time, value: "3.43–3.67 s vs ~4.5–4.9 s", note: "Compass-style pressure cues vs shoulder-pull cues" }
    - { label: Participants, value: "4", note: "Blindfolded indoor trials across two rooms" }
  highlights:
    - "End-to-end wearable robotics prototype with RGB-D perception, localisation, planning, and haptic actuation"
    - "Controlled comparison of two body-based haptic feedback methods"
    - "Timestamped haptic command logging for later EEG and workload analysis"
    - "Identified environment texture, rapid turns, and actuator salience as key failure modes"
  case_study:
    problem: |
      Indoor navigation remains difficult for visually impaired people because GPS is unreliable indoors and many aids
      are handheld, conspicuous, or dependent on audio. The engineering question was whether a hands-free wearable
      system could convert live spatial perception into haptic guidance that users could interpret quickly and safely.
    approach: |
      I helped integrate a ROS pipeline using RealSense RGB-D sensing, RTAB-Map localisation, artificial potential field
      planning, and Arduino-driven haptic actuation. Two feedback modes were implemented: a fixed-reference compass-style
      pressure cue on the back, and a shoulder-pull mechanism that indicated direction through left/right strap tension.
    experiments: |
      Four blindfolded sighted participants navigated fixed indoor routes in two rooms with different visual texture.
      Metrics included route success, collisions, lost odometry, reaction time, computational load, and qualitative feedback.
    results: |
      Compass-style pressure cues achieved higher success, fewer collisions, and faster responses than shoulder-pull cues.
      The pulling mechanism felt more natural to some users, but it was less distinguishable during navigation. Visual
      texture improved localisation, while rapid turns and plain environments remained failure modes.
    challenges:
      - "Servo torque and mechanical comfort constrained haptic salience"
      - "Visual SLAM degraded during rapid rotations and low-texture scenes"
      - "Small participant count limited statistical power"
      - "Multi-device ROS networking introduced timing and transform-management complexity"
    learnings:
      - "Body-referenced haptic cues need a stable reference point to be interpreted quickly"
      - "Assistive robotics performance depends on the environment, not just the algorithm"
      - "Event-synchronised logging is feasible and valuable for later workload analysis"
    next_steps:
      - "Use lighter and higher-torque actuators"
      - "Improve localisation through multi-camera sensing or sensor fusion"
      - "Run a larger study with visually impaired participants and adaptive feedback"
  links:
    repo: https://github.com/tyecam1/Mechatronic-Walkaide
    docs: ""
    demo: ""
    video: ""
    paper: https://github.com/tyecam1/Mechatronic-Walkaide/blob/main/Report%20Write%20Up/WearableNavigationAid-FinalReport.pdf
