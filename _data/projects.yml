- key: phd-hrc-adoption
  featured: true
  status: current
  toc_title: PhD Research
  title: Adoption-Aware Collaborative Robotics for Process Engineering
  dates:
    start: 2025-10-01
  role: PhD Researcher
  domain: Human-Robot Collaboration | Process Engineering | Design Research
  one_liner: >
    Investigating when collaborative robots become worth adopting in laboratory and process-engineering workflows.
  summary_short: >
    My PhD at the University of Strathclyde examines the conditions under which collaborative robotics is genuinely
    worth adopting, not just technically possible. The work combines design research methodology, industrial task
    analysis, human factors, safety-aware benchmark design, and practical robotics integration with CPI as industrial
    partner.
  tags:
    - Human-robot collaboration
    - Process engineering
    - Adoption evidence
    - Benchmark design
    - Human factors
    - Safety-aware autonomy
    - Design Research Methodology
  stack:
    - Python
    - ROS
    - Obsidian/Zotero research pipeline
    - Literature review
    - Experimental design
    - Benchmarking
  impact_metrics:
    - { label: Research frame, value: "DRM Type-3", note: "Reference model, descriptive study, prescriptive study, evaluation" }
    - { label: Industrial context, value: "CPI", note: "Process-engineering and laboratory automation workflows" }
    - { label: Current focus, value: "Benchmark design", note: "Preparative handling and constrained manipulation tasks" }
  highlights:
    - "Frames collaborative robotics around adoption value, not isolated task success"
    - "Develops benchmark requirements for laboratory and process-engineering work"
    - "Connects workflow, safety, human judgement, traceability, and uncertainty recovery"
    - "Uses evidence synthesis to derive measurable claims and evaluation criteria"
  case_study:
    problem: >
      Collaborative robots are often evaluated as if technical task execution were enough. In process-engineering
      and laboratory contexts, that misses the harder question: whether the robot improves a real workflow once
      safety, traceability, material state, human judgement, and recovery from uncertainty are included.
    approach: >
      I am using a design-research structure to move from problem clarification to benchmark design and evaluation.
      The work currently focuses on two industrially meaningful task families: preparative handling, where material
      state and handover quality matter, and constrained manipulation, where access, visibility, force control, and
      safe recovery are degraded.
    experiments: >
      Current experimental planning defines task benchmarks, adoption criteria, human-role boundaries, and measurement
      recipes for efficiency, safety, workload, trust calibration, intervention quality, and failure recovery.
    results: >
      Year-one outputs have reframed the PhD around adoption-worthiness, produced a structured research map, and
      narrowed the benchmark direction toward preparative handling and constrained manipulation rather than generic
      collaborative assembly.
    learnings:
      - "A technically capable robot is not automatically adoptable"
      - "Benchmarks must expose task context, human role, and failure-recovery behaviour"
      - "Human factors need event-timed measures, not only post-task questionnaires"
    next_steps:
      - "Complete the first literature review and evidence model"
      - "Develop the benchmark protocol with CPI"
      - "Build the first demonstrator experiment and measurement pipeline"
