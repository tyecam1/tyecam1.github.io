- key: rl-sumo
  featured: false
  status: past
  toc_title: RL Quadruped Sumo
  title: Reinforcement Learning-Based Control of a Quadruped Agent in a Simulated Sumo Arena
  dates:
    start: 2023-08-01
    end: 2024-01-01
  role: Reinforcement Learning Engineer (course project)
  domain: Reinforcement Learning | Robotics | Simulation
  one_liner: >
    PPO control for simulated ANYmal sumo, useful mainly as a lesson in reward design, opponent diversity, and brittle contact policies.
  summary_short: >
    Trained a simulated ANYmal agent in RaiSim using Proximal Policy Optimisation and a simple reward-embedded curriculum.
    The policy discovered aggressive contact behaviours, including a risky leap opener, but generalisation was limited by
    simplified opponent modelling and reward side effects.
  tags: [PPO, Curriculum learning, RaiSim, Reward shaping, Contact-rich control]
  stack: [PyTorch, RaiSim/RaisimGym, CUDA, NumPy, TensorBoard]
  impact_metrics:
    - { label: Training scale, value: "100 envs", note: "Vectorised training with 30 CPU threads" }
    - { label: Control rate, value: "100 Hz", note: "0.01 s control timestep" }
    - { label: Key lesson, value: "Reward brittleness", note: "Impact rewards encouraged contact rather than reliable destabilisation" }
  highlights:
    - "Implemented PPO with vectorised RaiSim environments"
    - "Designed a two-stage reward curriculum around distance-to-centre"
    - "Diagnosed failure modes caused by opponent simplification and over-aggressive contact rewards"
  case_study:
    problem: |
      Contact-rich quadruped competition is hard to model with classical control because the agent must balance
      locomotion, stability, aggression, and recovery in a sparse-reward environment.
    approach: |
      I trained an ANYmal agent with Proximal Policy Optimisation in RaiSim. The reward curriculum encouraged approach
      and impact when far from centre, then stability and centre control during close engagement.
    experiments: |
      Training varied reward coefficients, PPO parameters, and simplified opponent behaviours. Evaluation focused on
      win behaviour, stability, and qualitative policy failure modes.
    results: |
      The agent learned forceful engagement and a high-impact leap opener. That behaviour sometimes destabilised the
      opponent but often caused self-destabilisation. The project therefore became a useful negative case study: without
      opponent diversity and careful reward design, reinforcement-learning policies can look impressive while remaining brittle.
    learnings:
      - "Rewarding contact is not the same as rewarding useful destabilisation"
      - "Simplified opponents improve training speed but cap generalisation"
      - "Aggressive policies need explicit risk and recovery terms"
    next_steps:
      - "Train against opponent ensembles or self-play"
      - "Use domain randomisation for friction, mass, and contact parameters"
      - "Reward opponent destabilisation and ring-out events rather than sustained contact"
  links:
    repo: https://github.com/tyecam1/KAIST-Anymal-Sumo
    docs: ""
    demo: ""
    video: ""
    paper: https://github.com/tyecam1/KAIST-Anymal-Sumo/blob/master/ME491_project/report/TyeCameronFinalReport.pdf
